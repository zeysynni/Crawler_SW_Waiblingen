[project]
name = "web-crawler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
]

[dependency-groups]
convert = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
]
# RAG layer: retrieval/ (md -> chunks -> embeddings -> Chroma)
# and faq_bot/ (answer + Gradio UI). Not needed to run the crawler:
#   uv sync --group bot
bot = [
    "ipykernel>=6.30.1",
    "langchain>=0.3.27",
    "langchain-community>=0.3.30",
    "langchain-openai>=0.3.33",
    "langchain-chroma>=0.2.6",
    "langchain-text-splitters>=0.3.11",
    "chromadb>=1.1.0",
    "openai>=1.109.1",
    "gradio>=6.0",
    "scikit-learn",
    "plotly",
    "nbformat>=4.2.0",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]   # let tests/ import config.py from the repo root
testpaths = ["tests"]
